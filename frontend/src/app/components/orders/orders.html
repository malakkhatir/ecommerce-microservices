<div class="container">
  <div class="header">
    <h2>📋 Commandes</h2>
    <button class="btn-add" (click)="showForm = !showForm">+ Nouvelle commande</button>
  </div>

  <div class="error" *ngIf="error">{{ error }}</div>

  <!-- Formulaire -->
  <div class="form-card" *ngIf="showForm">
    <h3>Nouvelle commande</h3>

    <label>ID Produit</label>
    <input [(ngModel)]="form.productId" placeholder="ID du produit" />

    <label>ID Client</label>
    <input [(ngModel)]="form.clientId" type="number" placeholder="ID du client" />

    <label>Quantité</label>
    <input [(ngModel)]="form.quantity" type="number" min="1" placeholder="Quantité" />

    <div class="form-actions">
      <button class="btn-save"   (click)="submitForm()">✅ Commander</button>
      <button class="btn-cancel" (click)="showForm = false">✖ Annuler</button>
    </div>
  </div>

  <!-- Table -->
  <div class="loading" *ngIf="loading">Chargement...</div>

  <table *ngIf="!loading && orders.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>Produit ID</th>
        <th>Client ID</th>
        <th>Quantité</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.productId }}</td>
        <td>{{ order.clientId }}</td>
        <td><span class="badge">{{ order.quantity }}</span></td>
        <td>{{ order.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </tbody>
  </table>

  <div class="empty" *ngIf="!loading && orders.length === 0">
    Aucune commande trouvée.
  </div>
</div>
